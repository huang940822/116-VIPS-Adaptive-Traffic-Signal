<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedestrian Traffic Light</title>
  <style>
    body {
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #light {
      width: 100vw;
      height: 100vh;
      background-color: #333;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .icon {
      width: 80vmin;
      height: 80vmin;
      opacity: 0;
      transition: opacity 0.5s;
      position: absolute;
      z-index: 2;
    }

    .active {
      opacity: 1;
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 1.2em;
    }
  </style>
</head>

<body>
  <div id="light">
    <img id="redIcon" class="icon" src="sprite_red.png" style="display: none;" />
    <svg id="greenIcon" class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="60" height="60" fill="green" rx="10" ry="10" />
      <path d="M32 20 L28 30 L26 45 L36 45 L34 30 L32 20 Z" fill="white" />
    </svg>
    <img id="greenAnimation" class="icon" src="sprite_0.png" style="display: none;" />
    <div id="status">🚦 正在連線號誌控制器...</div>
  </div>

  <script>
    window.onload = function () {
      const socket = new WebSocket("ws://140.116.245.236:8080");

      const redIcon = document.getElementById("redIcon");
      const greenIcon = document.getElementById("greenIcon");
      const greenAnimation = document.getElementById("greenAnimation");
      const statusText = document.getElementById("status");

      const frameCount = 5;
      let currentFrame = 0;
      let animationInterval = null;

      function startGreenAnimation() {
        greenIcon.style.display = "none";
        greenAnimation.style.display = "block";
        greenAnimation.classList.add("active");
        currentFrame = 0;
        animationInterval = setInterval(() => {
          greenAnimation.src = `sprite_${currentFrame}.png`;
          currentFrame = (currentFrame + 1) % frameCount;
        }, 300);
      }

      function startGreenFlashAnimation() {
        greenIcon.style.display = "none";
        greenAnimation.style.display = "block";
        greenAnimation.classList.add("active");
        let sequence = [0, 5, 1, 5, 2, 5, 3, 5, 4, 5];
        let currentIndex = 0;
        animationInterval = setInterval(() => {
          const currentFrame = sequence[currentIndex];
          greenAnimation.src = `sprite_${currentFrame}.png`;
          currentIndex = (currentIndex + 1) % sequence.length;
        }, 300);
      }

      function stopGreenAnimation() {
        clearInterval(animationInterval);
        greenAnimation.classList.remove("active");
        greenAnimation.style.display = "none";
        greenIcon.style.display = "none";
      }

      socket.onmessage = function (event) {
        const signal = event.data;
        console.log("Received signal:", signal);
        statusText.innerText = `🚦 目前號誌：${signal}`;

        redIcon.classList.remove("active");
        stopGreenAnimation();

        if (signal === "Red" || signal === "Red(CarPhase)" || signal === "Red(CarPhase), 行人即將放行") {
          redIcon.style.display = "block";
          redIcon.classList.add("active");
        } 
        // else if (signal === "Red(CarPhase)"){
        //   redIcon.style.display = "block";
        //   redIcon.classList.add("active");
        // }
        else if (signal === "Green") {
          startGreenAnimation();
        } else if (signal === "GreenFlash") {
          startGreenFlashAnimation();
        } 
        // else if (signal === "Ready") {
        //   statusText.innerText = "🟢 行人即將放行，請準備！";
        //   // 也可以顯示一個新圖示或動畫
        //   greenIcon.style.display = "block";
        //   greenIcon.classList.add("blink"); // 例如閃爍
        // }
        else if (signal === "car mode start") {
          statusText.innerText = "車輛時相開始";
        }
      };

      socket.onopen = () => {
        console.log("Connected");
        statusText.innerText = "✅ 已連線，等待號誌訊號...";
      };

      socket.onclose = () => {
        console.log("Disconnected");
        statusText.innerText = "❌ 已斷線，請重整頁面";
      };

      socket.onerror = (err) => {
        console.log("Error:", err);
        statusText.innerText = "⚠️ WebSocket 錯誤";
      };
    };
  </script>
</body>

</html>
