<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedestrian Traffic Light</title>
  <style>
    body {
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #light {
      width: 100vw;
      height: 100vh;
      background-color: #333;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .icon {
      width: 80vmin;
      height: 80vmin;
      opacity: 0;
      transition: opacity 0.5s;
      position: absolute;
      z-index: 2; /* 加這個就能跳到最上層 */
    }

    .active {
      opacity: 1;/*顯示在網頁上*/
    }

    .blink {
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="light">
    <!-- 小紅人 (SVG) -->
    <img id="redIcon" class="icon" src="" style="display: none;" />
      
    </svg>

    <!-- 小綠人 (SVG 預設靜止狀態，可加回來用 -->
    <svg id="greenIcon" class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="60" height="60" fill="green" rx="10" ry="10"/>
      <path d="M32 20 L28 30 L26 45 L36 45 L34 30 L32 20 Z" fill="white"/>
    </svg>

    <!-- 綠人動畫 (圖片輪播) -->
    <img id="greenAnimation" class="icon" src="" style="display: none;" />
    
</div>

  <script>
    window.onload = function () {
      //const socket = new WebSocket("ws://localhost:8080");
      const socket = new WebSocket("ws://140.116.245.236:8080");
      //const socket = new WebSocket("tcp://0.tcp.jp.ngrok.io:13223"); // 使用 ngrok 轉發的 TCP 地址
      //const socket = new WebSocket("wss://d818-59-127-27-251.ngrok-free.app"); // 使用 ngrok 轉發的 TCP 地址

      const redIcon = document.getElementById("redIcon");
      const greenIcon = document.getElementById("greenIcon");
      const greenAnimation = document.getElementById("greenAnimation");
      const greenFlashAnimation = document.getElementById("greenAnimation");

      const frameCount = 5;
      let currentFrame = 0;
      let animationInterval = null;

      function startGreenAnimation() {
        greenIcon.style.display = "none";
        greenAnimation.style.display = "block";
        greenAnimation.classList.add("active"); 
        currentFrame = 0;

        animationInterval = setInterval(() => {
          greenAnimation.src = `sprite_${currentFrame}.png`; // 圖片檔命名要正確
          currentFrame = (currentFrame+1) % frameCount ;
          
          
        }, 300); // 每 0.3 秒切換
      }

      function startGreenFlashAnimation() {
        greenIcon.style.display = "none";
        greenAnimation.style.display = "block";
        greenAnimation.classList.add("active");

        // 預設從第 0 張圖開始
        let sequence = [0, 5, 1, 5, 2, 5, 3, 5, 4, 5]; // 輪播順序
        let currentIndex = 0;
        
        animationInterval = setInterval(() => {
            const currentFrame = sequence[currentIndex];
            greenAnimation.src = `sprite_${currentFrame}.png`; // 切換圖片
            currentIndex = (currentIndex + 1) % sequence.length; // 更新索引（按序輪播）

        }, 300); // 每 0.3 秒換一張圖片
      }

      function stopGreenAnimation() {
        clearInterval(animationInterval);
        greenAnimation.classList.remove("active"); 
        greenAnimation.style.display = "none";
        greenIcon.style.display = "none";
      }

      socket.onmessage = function (event) {
        const signal = event.data;
        console.log("Received signal:", signal);

        redIcon.classList.remove("active");
        //greenIcon.classList.remove("active", "blink");
        stopGreenAnimation();

        if (signal === "Red") {
            redIcon.src = "sprite_red.png"; // 設定紅燈圖片
            redIcon.style.display = "block"; // 顯示紅燈
            redIcon.classList.add("active");

        } else if (signal === "Green") {
          startGreenAnimation();
        } else if (signal === "GreenFlash") {
            startGreenFlashAnimation();
        }
      };

      socket.onopen = () => console.log("Connected");
      socket.onclose = () => console.log("Disconnected");
      socket.onerror = (err) => console.log("Error:", err);
    };
  </script>
</body>
</html>
